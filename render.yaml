# Render Blueprint — deploys Bio-One Social Hub as a free Node web service.
# When you connect this repo to Render as a Blueprint, these settings are
# filled in automatically. Docs: https://render.com/docs/blueprint-spec
#
# NOTE: the "free" plan has no persistent disk, so data resets when the
# service sleeps or redeploys. To keep data, change `plan: free` to
# `plan: starter` and add a disk (see the commented block below).
services:
  - type: web
    name: bio-one-social-hub
    runtime: node
    plan: free
    branch: claude/gallant-fermat-dmd95f
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # How often the scheduler checks for due posts (ms). Default 30s.
      - key: SCHEDULER_INTERVAL_MS
        value: "30000"
      # Public URL of this app (OAuth redirect + media URLs Meta fetches)
      - key: APP_BASE_URL
        value: https://bio-one-social-hub.onrender.com
      # Secrets — set these in the Render dashboard (Environment), not in code.
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false

# ── To upgrade to persistent storage later (paid) ──────────────────────────
#   1. change `plan: free` above to `plan: starter`
#   2. uncomment the disk block below and add `DATA_DIR=/data` under envVars
#   3. (a small code tweak will point storage at /data — ask Claude when ready)
#
#    disk:
#      name: data
#      mountPath: /data
#      sizeGB: 1
